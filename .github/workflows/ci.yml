name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  hifi-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.10" # Match the Compose-pinned hifi-api image.
      - run: python3 -m venv /tmp/lumen-hifi-tests
      - run: /tmp/lumen-hifi-tests/bin/pip install -r hifi-api/requirements-test.txt
      - run: /tmp/lumen-hifi-tests/bin/python -m unittest discover -s hifi-api -p 'test_*.py'
      # The unit tests stub upstream; this imports the extension into the
      # commit pinned in docker-compose.yml, so a pin bump that renames an
      # internal the extension patches fails here instead of in production.
      - name: Check against the pinned upstream
        run: |
          ref=$(sed -n 's|.*binimum/hifi-api\.git#\([0-9a-f]\{40\}\).*|\1|p' docker-compose.yml)
          test -n "$ref"
          git clone --quiet https://github.com/binimum/hifi-api.git /tmp/hifi-upstream
          git -C /tmp/hifi-upstream checkout --quiet "$ref"
          python3 -m venv /tmp/hifi-upstream-venv
          /tmp/hifi-upstream-venv/bin/pip install --quiet -r /tmp/hifi-upstream/requirements.txt
          /tmp/hifi-upstream-venv/bin/python hifi-api/check_upstream.py /tmp/hifi-upstream

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen_test
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen -d lumen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LUMEN_REVIEW_TEST_DATABASE_URL: postgres://lumen:lumen_test@localhost:5432/lumen_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.9"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The Filen helper ships in the backend image (Alpine's Node 22).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/filen-downloader/package-lock.json
      - name: Filen helper tests
        working-directory: backend/filen-downloader
        run: |
          npm ci --no-audit --no-fund
          npm test

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            core/package-lock.json
      # The typecheck compiles ../core/src too; core resolves react types
      # from its own node_modules, so install its dev deps as well.
      - run: npm ci
        working-directory: core
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # lintapple checks the app's screens in Chromium against ui-policy.json,
  # with tests/ui/mock-api.ts standing in for the backend. It needs Node 22.
  frontend-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            core/package-lock.json
      - run: npm ci
        working-directory: core
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run lint:ui

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22" # Wrangler and ESLint 10 need Node ^22.13 || >=24
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # lintapple checks the built page in Chromium against ui-policy.json.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run lint:ui

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # `npm ci`'s postinstall runs sync:core, which regenerates the vendored
      # mobile/packages/music-library-core from ../core. The --check step then
      # fails the job if that postinstall was skipped or the copy is missing.
      - run: npm ci
      - name: core vendored copy is present and current
        run: npm run sync:core -- --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  backend-image:
    needs: backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  frontend-image:
    needs: frontend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
