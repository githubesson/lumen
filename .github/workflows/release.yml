name: release

# Build and publish desktop binaries for every version tag. electron-builder
# creates (or appends assets to) the GitHub Release for the tag, which the
# web app's "Download desktop app" button resolves via the releases API.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional: bakes Rich Presence support into the build (blank = off).
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            core/package-lock.json

      - run: npm ci
        working-directory: core

      - run: npm ci
        working-directory: frontend

      # The tag is the single source of truth for the app version; artifacts
      # come out as Lumen-<version>-setup.exe / Lumen-<version>-universal.dmg.
      - run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - run: npm run electron:compile
        working-directory: frontend

      # Committed assets (icon.ico / icon.icns / dmg-background*.png) are used
      # as-is; `npm run icons` is skipped because its macOS Assets.car step
      # needs Xcode 26, which hosted runners don't have. The optional radio
      # add-on is skipped automatically (no _local/ in CI); see
      # electron-builder.cjs.
      - run: npx electron-builder ${{ matrix.args }} --publish always --config electron-builder.cjs
        working-directory: frontend
