appId: com.lumen.music-library
productName: Lumen
copyright: ""
directories:
  output: release
asar: true
files:
  - package.json
  - electron/package.json
  - electron/setup.html
  - electron/build/**/*
  - dist/**/*
  - "!**/*.map"
# Optional private add-on: the FH6 radio bridge DLL + config are pulled from a
# local, untracked folder. Without it, remove this block before electron:build.
extraResources:
  - from: ../_local/fh6-spotify-mod/lumen-radio/dist
    to: lumen-radio
    filter:
      - version.dll
      - fh6-radio/config.toml
# On macOS the hook bundles electron/assets/Assets.car (when present) so
# macOS 26 renders the light/dark/tinted icon variants natively — generate it
# with scripts/generate-mac-icon-assets.sh. No-op on Windows and while the
# file doesn't exist.
afterPack: scripts/mac-appearance-icon.cjs
mac:
  # Static fallback for macOS < 26; appearance variants come from Assets.car.
  icon: electron/assets/icon.icns
win:
  icon: electron/assets/icon.ico
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
dmg:
  background: electron/assets/dmg-background.png
  window:
    width: 540
    height: 380
  iconSize: 80
  iconTextSize: 12
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
portable:
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
