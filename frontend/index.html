<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <title>Lumen — Music Library</title>
    <!-- The UI font's Latin subset: fetch it with the CSS instead of after
         first layout, so text doesn't swap in late. -->
    <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (() => {
        const saved = (() => {
          try { return JSON.parse(localStorage.getItem("lumen.tweaks") || "{}"); }
          catch { return {}; }
        })();
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = saved.theme || (prefersDark ? "dark" : "light");
        const depth = saved.depth ?? 2;
        const radius = saved.radius ?? 10;
        const density = saved.density || "balanced";
        const layout = saved.layout || "sidebar";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-depth", depth);
        document.documentElement.setAttribute("data-radius", radius);
        document.documentElement.setAttribute("data-density", density);
        document.documentElement.setAttribute("data-layout", layout);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
