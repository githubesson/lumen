[package]
name = "lumen-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lumen's desktop client, drawn with Rune"
publish = false

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
# Rune is pre-release: pin a rev of `dev` (never rewritten).
rune = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924", features = ["native-file-dialog"] }
rune-motion = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json", "cookies", "gzip"] }
dirs = "6"
urlencoding = "2"
# The desktop layer (`src/desktop`): URL rules as the web's, release versions,
# hashes and tokens (ring is rustls's, already built), base64url tokens.
url = "2"
semver = "1"
ring = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Rune's version: the frameless window's hit-testing, mini player bounds,
# single instance and Discord's named pipe (`src/desktop/win32.rs`).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# The icon, version info and manifest in lumen.exe (`build.rs`).
embed-resource = "3"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
codegen-units = 16
incremental = true

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "thin"
strip = true
incremental = false
