[package]
name = "lumen-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lumen's desktop client, drawn with Rune"
publish = false

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
# Rune is pre-release: pin a rev of `dev` (never rewritten).
rune = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924", features = ["native-file-dialog"] }
rune-motion = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json", "cookies", "gzip"] }
dirs = "6"
urlencoding = "2"
# Cover art: decoded and resized off the UI thread to the size it draws at.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
url = "2"
# The desktop layer (`src/desktop`): release versions, hashes and tokens (ring
# is rustls's, already built), base64url tokens.
semver = "1"
ring = "0.17"
base64 = "0.22"
# The player (src/player): shuffle order, decoding, resampling, the HLS keys,
# the device socket.
fastrand = "2"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "adpcm", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
opuscule = "0.2.2"
rubato = { version = "0.16", default-features = false, features = ["fft_resampler"] }
rtrb = "0.3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
uuid = { version = "1", features = ["v4"] }


# The local time zone (`localtime_r`) for dates shown in local time.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Audio output: WASAPI on Windows, Core Audio on macOS. Linux builds play
# silently on a clock unless built with `--features alsa` (needs libasound).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", optional = true }

[target.'cfg(windows)'.dependencies]
# The System Media Transport Controls (media keys, the OS media flyout).
windows = { version = "0.62", features = ["Foundation", "Media", "Media_Playback", "Storage_Streams"] }
# Rune's version: the frameless window's hit-testing, mini player bounds,
# single instance and Discord's named pipe (`src/desktop/win32.rs`).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
alsa = ["dep:cpal"]

[build-dependencies]
# The icon, version info and manifest in lumen.exe (`build.rs`).
embed-resource = "3"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
codegen-units = 16
incremental = true

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "thin"
strip = true
incremental = false

# Rune comes from `vendor/rune`: upstream at the rev above plus our patches
# (`vendor/README.md`). Its sibling crates (`rune-motion`, …) still come from git
# at the same rev, so ours and vendored Rune's unify.
[patch."https://github.com/anomalyco/rune"]
rune = { path = "vendor/rune" }
